# SecondaryModel (M2 meta-labeling, CIKM'26 paper code) — uv application project.
#
#   mise install && mise run install     # tools + locked environment
#   mise run check                       # lint, fast tests, import smoke test
#
# The code is run as scripts with src/ on the path (python src/m2_pipeline.py,
# `from Utils... import`), so this is not an installable package. Versions of the
# ML stack equal the `CTTS` conda env on gpu8 (2026-06): change them deliberately,
# a trained bundle unpickles against them. Dependencies are the packages src/ imports.

[project]
name = "secondarymodel"
version = "0.1.0"
description = "M2 meta-labeling on top of M1 foundation-model forecasts (Kronos, Chronos2, Fincast, Tirex)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Pinned (==): what the pickled M2 bundles depend on, = CTTS training env.
    # Lower bounds (>=): everything else.
    "numpy>=2.3,<2.4",  # CTTS has 2.4.4, which violates autogluon-tabular 1.5 (numpy<2.4)
    "pandas==2.2.2",
    "scipy>=1.16.2",
    "scikit-learn==1.6.1",
    "joblib>=1.4",
    "torch==2.9.0",
    # M2 classifiers: pinned (bundles are pickles of these)
    "tabpfn==7.1.0",
    "tabicl==2.0.3",
    "tabm==0.0.3",
    "rtdl-num-embeddings==0.0.12",
    "xgboost==3.2.0",
    "autogluon-tabular==1.5.0",
    "skops>=0.13",
    # Kumo Tabular (NVIDIA, 2026-09-29) — in-context foundation model, openly
    # licensed (OpenMDW-1.1). Needs Python>=3.11, torch>=2.7.
    "structured-data-models==0.2.1",
    # Feature attribution (MDA/SHAP/LIME ranking) + HPO
    "shap>=0.51.0",
    "lime>=0.2.0.1",
    "optuna>=4.5.0",
    # Data, IO, config
    "pyarrow>=20,<21",  # CTTS has 23.0.1, which violates autogluon 1.5 (pyarrow<21)
    "pyyaml>=6.0.3",
    "pydantic>=2.9",  # tb_pilot/schemas.py: validated config.yaml overrides
    "requests>=2.32",
    "openpyxl>=3.1",  # pd.read_excel in Data_MLA/XFeatures
    "tqdm>=4.67.1",
    # Plots
    "matplotlib>=3.9.3",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "ty>=0.0.1a25",
    "deptry>=0.23",
    "pre-commit>=4.3",
    "pytest-xdist>=3.6",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.uv.sources]
# CUDA 12.8 wheels on the Linux GPU server (= CTTS: torch 2.9.0+cu128); PyPI on macOS.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# ┏━━━━━━━━━━ Lint ━━━━━━━━━━┓
[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src"]
extend-exclude = ["src/Output", "*.ipynb"]

[tool.ruff.lint]
# Existing research code: enforce the rules that find real bugs (undefined names,
# wrong imports, mutable defaults, unreachable/unused results), not style.
select = ["F", "E9", "B", "PLE"]
ignore = [
    "F401",  # re-exports in __init__ files and notebook-style imports
    "F403", "F405",  # star imports in legacy modules
    "F841",  # unused locals are noise in analysis scripts
    "F541",  # f-string without placeholders: style only
    "B007", "B008", "B023", "B028", "B904", "B905", "B006",
]

[tool.ruff.lint.per-file-ignores]
# Pre-existing issues in Pablo's analysis/plotting code, measured 2026-10-26 on
# this PR's actual module set (upstream/main, no later elie/sota commits) —
# not introduced here and not fixed here; this PR's scope is uv/mise/CI
# tooling, not a bug-fixing pass. F811: benign local re-imports/shadowed names
# (os/json/shutil/stats re-imported inside a function, a param named like an
# imported helper). F821/B020: real bugs (missing `import json`, a dead
# `if __name__: main()`, a radar-plot ring snap missing its zone variable, a
# helper renamed elsewhere without updating its one caller, two undefined loop
# vars) left as-is pending a dedicated fix pass.
"src/Utils/analysis/analysis_m2.py" = ["F811", "F821"]
"src/Utils/analysis/analysis_meta_labels.py" = ["F811"]
"src/Utils/classifier/autogluon_classifier.py" = ["F811"]
"src/Utils/classifier/ctts/model.py" = ["B020"]
"src/Utils/edge/edge.py" = ["F811", "F821"]
"src/Utils/edge/plots.py" = ["F821"]
"src/Utils/feature_selection/plots.py" = ["F811"]
"src/Utils/feature_selection_experiment.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["Utils", "Data_MLA"]

[tool.ruff.format]
# Pablo's layout is kept; only new files (tests/) are formatted.
exclude = ["src/**", "*.md"]  # ruff also formats Python blocks in Markdown (CLAUDE.md, README)

# ┏━━━━━━━━━━ Tests ━━━━━━━━━━┓
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: imports the whole ML stack (torch, autogluon) — deselect with -m 'not slow'",
]

[tool.deptry]
known_first_party = ["Utils", "Data_MLA", "src", "indicators"]
# pyarrow: version constraint for autogluon; openpyxl: pd.read_excel engine.
per_rule_ignores = { DEP002 = ["pyarrow", "openpyxl"] }
